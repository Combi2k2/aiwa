[project]
name = "aiwa"
version = "0.1.0"
description = "AI watcher: watches how you work and nudges you at the right moment."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "platformdirs>=4",
    "python-dotenv>=1",
    "requests>=2.31",
    "PySide6>=6.6",
]

[project.scripts]
aiwa = "aiwa.cli:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = ["tests"]
