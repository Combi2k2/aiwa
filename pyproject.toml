[project]
name = "aiwa"
version = "0.1.0"
description = "AI watcher: watches how you work and nudges you at the right moment."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "platformdirs>=4",
    "python-dotenv>=1",
    "requests>=2.31",
    "PySide6>=6.6",
]

[project.scripts]
aiwa = "aiwa.cli:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
# the code lives in src/ and is imported as `aiwa` (tests/test_packaging.py checks this list)
package-dir = {"aiwa" = "src"}
packages = [
    "aiwa", "aiwa.commands", "aiwa.core", "aiwa.metrics", "aiwa.platforms", "aiwa.rules",
    "aiwa.services", "aiwa.signals", "aiwa.signals.focus", "aiwa.ui",
]

[tool.setuptools.package-data]
aiwa = ["assets/sounds/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
